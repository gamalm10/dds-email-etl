services:
  dds-api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      dds-db:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  dds-db:
    image: mariadb:11
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIA_DATABASE:-dds}
      MARIADB_USER: ${MARIA_USER:-dds}
      MARIADB_PASSWORD: ${MARIA_PASSWORD:-ddspass}
    ports:
      - "3307:3306"
    volumes:
      - dds_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su=mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dds-frontend:
    build: ./dds-frontend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://dds-api:8000
      - MARIA_HOST=dds-db
      - MARIA_PORT=3306
    depends_on:
      dds-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dds_data:
